name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # `main` requires this job's check to pass before merging, so keep the job name stable.
  # Don't add a version matrix: matrix values become part of the check name.
  build_test:
    name: build_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CI: ""
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build --if-present
        env:
          CI: ""
      - name: Test
        run: npm run test
        env:
          CI: ""
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
